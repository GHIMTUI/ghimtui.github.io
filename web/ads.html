<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adblock Editor Pro</title>
    <style>
        :root {
            --bg-dark: #000000;
            --container-bg: #050505;
            --accent-green: #15803d;
            --accent-hover: #166534;
            --accent-blue: #1d4ed8;
            --text-white: #ffffff;
            --border-color: #1a1a1a;
            --status-gray-bg: #1a1a1a;
            --status-text-gray: #666;
            --error-red: #ef4444;
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-white);
            overflow: hidden;
        }

        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            background-color: var(--bg-dark);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            background-color: #000000;
            z-index: 10;
        }

        .info-path {
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 38px;
        }

        .status-pill {
            padding: 0.6rem 1.2rem;
            border-radius: 50px; 
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            display: none; 
            align-items: center;
            justify-content: center;
            min-width: 100px;
            transition: all 0.3s ease;
            user-select: none;
            border: none;
            outline: none;
        }

        .status-pill.visible {
            display: inline-flex;
        }

        #svBtn {
            background-color: var(--accent-green);
            color: #ffffff;
            cursor: pointer;
        }

        #svBtn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .pill-gray-style {
            background-color: var(--status-gray-bg) !important;
            color: var(--status-text-gray) !important;
            cursor: default;
        }

        .fast-flash {
            animation: fast-flash-anim 0.4s ease-in-out infinite;
        }

        @keyframes fast-flash-anim {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .textarea-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
        }

        .code-input {
            flex: 1;
            width: 100%;
            border: 1px solid var(--border-color);
            outline: none;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            background-color: #050505;
            color: var(--text-white);
            resize: none;
            border-radius: 8px;
        }

        .code-input:focus {
            border-color: var(--accent-green);
        }

        @media (max-width: 640px) {
            .info-path { font-size: 0.9rem; }
            .status-pill { padding: 0.5rem 0.8rem; font-size: 0.65rem; min-width: 80px; }
            .actions { gap: 5px; }
        }
    </style>
</head>
<body>

<div class="editor-container">
    <div class="toolbar">
        <div class="info-path">ADBLOCK PRO</div>
        <div class="actions">
            <div id="statusContainer" class="status-pill visible pill-gray-style">KHỞI TẠO...</div>
            <button id="svBtn" class="status-pill"></button>
        </div>
    </div>

    <div class="tab-content">
        <div class="textarea-wrapper">
            <textarea id="txtAr" class="code-input" spellcheck="false" placeholder="Đang tải bộ lọc từ GitHub..."></textarea>
        </div>
    </div>
</div>

<script>
/**
 * Tính toán dung lượng văn bản theo KB
 */
function _format_kb_only(text) {
    const bytes = new TextEncoder().encode(text).length;
    return (bytes / 1024).toFixed(2) + " KB";
}

(function() {
    const _0x_u1 = ["Z2hwX3RLZzVQTFlk", "VlQweElPcko0R3VaSVU4S0M2V3BoTDNoUXhuZw=="];
    const _init_key = () => atob(_0x_u1[0] + _0x_u1[1]);

    const _app_opt = {
        _k: _init_key(),
        _o: "ghimtui",
        _r: "ghimtui.github.io",
        _p_ads: "file/ads.txt"
    };

    const _api_base = `https://api.github.com/repos/${_app_opt._o}/${_app_opt._r}/contents/`;
    const _dom_ar = document.getElementById('txtAr');
    const _dom_sv = document.getElementById('svBtn');
    const _dom_st = document.getElementById('statusContainer');

    let _v_sha_ads = null;
    let _last_saved_content = "";
    let _is_loading = true;

    function setBtnState(state) {
        if (!_dom_sv || !_dom_st) return;
        
        _dom_sv.classList.remove('visible', 'pill-gray-style', 'fast-flash');
        _dom_st.classList.remove('visible', 'pill-gray-style');
        _dom_sv.disabled = false;
        _dom_st.style.color = "";
        
        switch(state) {
            case 'loading': 
                _dom_st.innerText = "ĐỒNG BỘ..."; 
                _dom_st.classList.add('visible', 'pill-gray-style'); 
                break;
            case 'online':
                _dom_st.innerText = "ĐÃ KẾT NỐI..."; 
                _dom_st.classList.add('visible', 'pill-gray-style');
                setTimeout(() => { 
                    if (_dom_st.innerText === "ĐÃ KẾT NỐI...") {
                        _dom_st.classList.remove('visible'); 
                    }
                }, 2500);
                break;
            case 'saved': 
                _dom_sv.innerText = "ĐÃ LƯU"; 
                _dom_sv.disabled = true; 
                _dom_sv.classList.add('visible', 'pill-gray-style'); 
                break;
            case 'unsaved': 
                _dom_sv.innerText = "LƯU LẠI"; 
                _dom_sv.classList.add('visible'); 
                break;
            case 'saving': 
                _dom_sv.innerText = "LƯU LẠI...";
                _dom_sv.disabled = true; 
                _dom_sv.classList.add('visible', 'fast-flash');
                break;
            case 'offline':
                _dom_st.innerText = "MẤT KẾT NỐI"; 
                _dom_st.classList.add('visible', 'pill-gray-style'); 
                _dom_st.style.color = "var(--error-red)";
                _dom_sv.disabled = true;
                break;
            case 'error': 
                _dom_st.innerText = "LỖI XẢY RA"; 
                _dom_st.classList.add('visible', 'pill-gray-style'); 
                _dom_st.style.color = "var(--error-red)"; 
                break;
        }
    }

    function checkChanges() {
        if (_is_loading) return;
        if (!navigator.onLine) {
            setBtnState('offline');
            return;
        }
        
        if (_dom_ar.value !== _last_saved_content) {
            setBtnState('unsaved');
        } else {
            setBtnState('saved');
        }
    }

    // Loại bỏ giao thức http, https và tiền tố www.
    function _clean_url_prefix(str) {
        if (!str) return "";
        return str.trim().toLowerCase()
                  .replace(/^https?:\/\//i, '')
                  .replace(/^www\./i, '');
    }

    // Kiểm tra định dạng tên miền hợp lệ
    function _is_valid_domain(str) {
        if (!str) return false;
        let s = str.trim().toLowerCase();
        if (!s.includes('.') || s.startsWith('.') || s.endsWith('.') || s.startsWith('-') || s.endsWith('-')) return false;
        return /^[a-z0-9][a-z0-9-]*\.[a-z0-9.-]*[a-z]{2,}$/i.test(s);
    }

    function _standardize_content(rawInput) {
        let rawLines = rawInput.split('\n');
        let bodyLines = [];
        let oldMeta = { u: "" };

        rawLines.forEach(line => {
            let l = line.trim();
            if (!l) return;
            const uMatch = l.match(/!\s*Updated:\s*(.+)/i);
            if (uMatch) oldMeta.u = uMatch[1];
            if (l.match(/! (Title|Description|Describe|Updated|Version|Blocked|Size|=======)/i) || l.startsWith("[Adblock") || l.startsWith('!')) return;
            bodyLines.push(l);
        });

        let mergedMap = new Map();
        let otherRules = new Set();

        bodyLines.forEach(line => {
            let hideMatch = line.match(/^([^#\[\]\s,]+)(##|#@?#|#\$#|#\?#)(.*)$/);
            
            if (hideMatch) {
                let rawDomain = _clean_url_prefix(hideMatch[1]);
                let separator = hideMatch[2];
                let selectorPart = hideMatch[3]?.trim() || "";

                if (_is_valid_domain(rawDomain) && selectorPart !== "") {
                    let domain = rawDomain;
                    if (!mergedMap.has(domain)) mergedMap.set(domain, new Set());
                    
                    let selectors = selectorPart.split(/,(?![^\[]*\])/);
                    selectors.forEach(s => {
                        let trimmed = s.trim();
                        if (trimmed) mergedMap.get(domain).add(separator + trimmed);
                    });
                } 
            } else {
                let trimmedLine = line.trim();
                
                // Loại bỏ http/https/www nếu dòng chỉ là URL/domain thông thường
                if (!trimmedLine.startsWith('||') && !trimmedLine.startsWith('@@') && !trimmedLine.startsWith('/') && !trimmedLine.startsWith('#')) {
                    trimmedLine = _clean_url_prefix(trimmedLine);
                    if (!_is_valid_domain(trimmedLine)) return; 
                } else if (trimmedLine.startsWith('||')) {
                    // Xử lý loại bỏ www trong quy tắc dạng ||www.example.com^
                    trimmedLine = trimmedLine.replace(/^\|\|www\./i, '||');
                }
                
                if (trimmedLine) otherRules.add(trimmedLine);
            }
        });

        let processedBody = [];
        mergedMap.forEach((selectors, domain) => {
            if (selectors.size > 0) {
                let standardHides = [];
                let specialHides = [];
                selectors.forEach(s => {
                    if (s.startsWith('##')) standardHides.push(s.substring(2));
                    else specialHides.push(s);
                });

                if (standardHides.length > 0) {
                    processedBody.push(`${domain}##${standardHides.sort().join(',')}`);
                }
                specialHides.forEach(sh => processedBody.push(domain + sh));
            }
        });
        otherRules.forEach(rule => processedBody.push(rule));

        const strictSort = (a, b) => a.localeCompare(b);
        let uniqueBody = Array.from(new Set(processedBody)).sort(strictSort);

        const finalBlocked = uniqueBody.length; 
        const currentRulesOnly = uniqueBody.join('\n');
        const isRulesChanged = _last_saved_content.includes(currentRulesOnly) === false; 
        
        let finalUpdated = oldMeta.u;
        if (isRulesChanged) {
            const now = new Date();
            finalUpdated = now.toLocaleString('en-GB', { 
                day: '2-digit', 
                month: 'short', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: false,
                timeZone: 'Asia/Ho_Chi_Minh'
            }).replace(',', '');
        }

        let tempBodyOutput = [], lastGroupKey = "", lastDomainBase = "";
        uniqueBody.forEach(line => {
            let currentGroupKey = line.startsWith("@@||") ? "WHITELIST" : (/[a-zA-Z0-9]/.test(line[0]) ? line[0].toUpperCase() : "SPECIAL");
            let currentDomainBase = line.startsWith("@@||") ? line.substring(4).split(/[\/\^]/)[0] : (line.includes('#') ? line.split('#')[0] : "");

            if (lastGroupKey && lastGroupKey !== currentGroupKey) tempBodyOutput.push("");
            else if (lastDomainBase && currentDomainBase && lastDomainBase !== currentDomainBase && currentGroupKey !== "SPECIAL") tempBodyOutput.push("");

            tempBodyOutput.push(line);
            lastGroupKey = currentGroupKey;
            lastDomainBase = currentDomainBase;
        });

        const bodyContent = tempBodyOutput.join('\n');
        const mockHeader = `[Adblock Plus 2.0]\n! Title: STOP ADS\n! Describe: Chặn quảng cáo\n! Updated: ${finalUpdated}\n! Blocked: ${finalBlocked}\n! Size: 00.00 KB\n! ==================`;
        const finalSize = _format_kb_only(mockHeader + "\n\n" + bodyContent);

        const headerArr = [
            "[Adblock Plus 2.0]", 
            "! Title: STOP ADS", 
            "! Describe: Chặn quảng cáo", 
            `! Updated: ${finalUpdated}`,
            `! Blocked: ${finalBlocked}`,
            `! Size: ${finalSize}`,
            "! =================="
        ];
        
        return { 
            content: [...headerArr, "", ...tempBodyOutput].join('\n'), 
            isRulesChanged: isRulesChanged
        };
    }

    async function _fetch_file(path) { 
        try {
            const res = await fetch(`${_api_base}${path}`, { headers: { "Authorization": `Bearer ${_app_opt._k}` } }); 
            return res.ok ? await res.json() : null;
        } catch(e) { return null; }
    }
    
    async function _load(isReconnect = false) {
        if (!navigator.onLine) { 
            setBtnState('offline'); 
            return; 
        }
        
        if (isReconnect) {
            setBtnState('online');
            await new Promise(r => setTimeout(r, 1000));
        }

        setBtnState('loading');
        try {
            const ads = await _fetch_file(_app_opt._p_ads);

            if (ads) {
                _v_sha_ads = ads.sha;
                _dom_ar.value = _last_saved_content = decodeURIComponent(atob(ads.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            }

            _is_loading = false; 
            setBtnState('saved');
        } catch (e) { 
            setBtnState('error'); 
        }
    }

    async function _update_file(path, content, sha, message) {
        return await fetch(`${_api_base}${path}`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${_app_opt._k}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: message, content: btoa(String.fromCharCode(...new TextEncoder().encode(content))), sha: sha })
        });
    }

    if (_dom_ar) _dom_ar.addEventListener('input', checkChanges);

    if (_dom_sv) {
        _dom_sv.addEventListener('click', async () => {
            if (_dom_sv.disabled || !navigator.onLine) return;
            setBtnState('saving');
            try {
                const result = _standardize_content(_dom_ar.value);

                await _update_file(_app_opt._p_ads, result.content, _v_sha_ads, result.isRulesChanged ? `update filter` : "format rules");
                
                _last_saved_content = result.content;
                _dom_ar.value = result.content;
                
                await _load();
                setBtnState('saved');
            } catch (e) { 
                setBtnState('error'); 
            }
        });
    }

    window.addEventListener('online', () => {
        _load(true);
    });
    
    window.addEventListener('offline', () => {
        setBtnState('offline');
    });

    window.onload = () => _load(false);
})();
</script>
</body>
</html>
