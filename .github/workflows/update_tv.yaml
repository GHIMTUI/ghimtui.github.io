name: Auto Update TV

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 giờ
  workflow_dispatch: # Cho phép chạy thủ công trên GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python channels_update.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tivi.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update stream links for active channels" && git push)
