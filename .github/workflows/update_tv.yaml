name: Auto Update TV Links

on:
  schedule:
    - cron: '0 */24 * * *' # Chạy tự động mỗi 24 giờ
  workflow_dispatch: # Cho phép chạy thủ công trên giao diện GitHub

jobs:
  update-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python update_channels.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.py tivi.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update TV stream links [skip ci]" && git push)