name: Auto Update TV

on:
  schedule:
    - cron: '0 */24 * * *' # Chạy tự động mỗi 24 giờ
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python channels_update.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tivi.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update active channel links [skip ci]" && git push)
